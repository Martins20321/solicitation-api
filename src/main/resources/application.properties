spring.application.name=solicitation.api

# DataBase
spring.datasource.url=jdbc:postgresql://localhost:5432/solicitation_api
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
api.security.token.secretKey=${JWT_SECRET:dev-secret}

# Actuator - expose metrics
management.server.port=9001
management.endpoints.web.exposure.include=health,info,prometheus