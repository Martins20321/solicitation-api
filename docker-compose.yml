name: solicitation-api

services:
  db-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - network-solicitation
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${SPRING_DATASOURCE_USERNAME}", "-d", "${SPRING_DATASOURCE_DB}"]
      interval: 5s
      timeout: 10s
      retries: 5

  db-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      retries: 12
      start_period: 60s
    networks:
      - network-solicitation

  app:
    build: .
    ports:
      - "8080:8080"
      - "127.0.0.1:9001:9001"
    networks:
      - network-solicitation
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-postgres:5432/${SPRING_DATASOURCE_DB}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?USERNAME is required}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?PASSWORD is required}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SPRING_ELASTICSEARCH_URIS=http://db-elasticsearch:9200
    depends_on:
      db-postgres:
        condition: service_healthy
      db-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - network-solicitation

volumes:
  db-data:
  es-data:

networks:
  network-solicitation:
    driver: bridge