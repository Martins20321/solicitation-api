name: solicitation-api - CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Starting Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn test

      - name: Build Project
        run: mvn clean package -DskipTests